[build-system]
requires = ["setuptools>=77"]  # a license given as a string
build-backend = "setuptools.build_meta"

[project]
name = "claude-connector-kit"
version = "0.1.2"
description = "An OAuth 2.1 server and tool registration for MCP connectors used from Claude clients"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2,<3",
    "starlette>=0.40",
    "httpx2",   # sign_in; the SDK's own client
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools]
packages = ["claude_connector_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]
